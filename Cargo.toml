[package]
name = "netenum"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
indicatif = "0.17"
quick-xml = { version = "0.37", features = ["serialize", "serde"] }
socket2 = "0.5"
libc = "0.2"
pnet = "0.35"
ipnetwork = "0.20"
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
hickory-resolver = "0.25"
hickory-proto = "0.25"
hickory-client = "0.25"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging"] }
x509-parser = "0.18.1"
snmp2 = { version = "0.4", features = ["tokio"] }
smb = "0.11.2"
smb-rpc = "0.11.2"
