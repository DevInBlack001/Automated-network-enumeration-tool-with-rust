[package]
name = "netenum"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
indicatif = "0.17"
quick-xml = { version = "0.37", features = ["serialize", "serde"] }
socket2 = "0.5"
libc = "0.2"
pnet = "0.35"
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
